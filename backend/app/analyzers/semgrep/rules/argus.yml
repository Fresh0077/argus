# ARGUS 内置 Semgrep 规则集
#
# 这一份规则随仓库分发，**不依赖 Semgrep Registry、不联网**。
# 之所以不用 `--config=auto` 或 `p/python` 这类注册表规则：
#   - 注册表规则会随线上更新而改变，同一份代码今天和明天可能得到不同结果；
#   - 拉取规则需要网络，而本项目的演示环境不保证外网可达；
#   - 规则内容是分析结论的一部分，必须能被审阅、能写进文档。
#
# 规则形态：**全部使用 taint 模式**。
# 正则规则（app/analyzers/rules/）只能看到单行；Semgrep 做的是函数内数据流追踪，
# 两者互补。凡是 taint 模式能表达的，都优先用 taint——
# 它能回答"外部输入有没有流到这个位置"，而不只是"这一行长什么样"。
#
# 元数据约定（解析器据此把 Semgrep 结果转换成统一的 Finding）：
#   argus-type            漏洞类别，取值与本地规则层的词汇表一致，
#                         这样两个分析器命中同一行时才能按类别去重
#   argus-title           发现标题
#   argus-recommendation  修复建议
#   cwe                   CWE 编号（Semgrep 惯用格式："CWE-89: SQL Injection"）
#
# 注意：本文件含中文，读取它需要 UTF-8。调用方必须给子进程设置 PYTHONUTF8=1，
# 否则中文 Windows 上 Semgrep 会按 GBK 解码本文件并直接崩溃。

rules:
  # ------------------------------------------------------------------
  # Python
  # ------------------------------------------------------------------

  - id: argus.semgrep.python-sqli
    languages: [python]
    severity: ERROR
    message: 疑似 SQL 注入：外部输入经数据流到达数据库执行
    metadata:
      argus-type: sql_injection
      argus-title: 疑似 SQL 注入（数据流已确认来源）
      argus-recommendation: 改用参数化查询，把取值全部通过占位符绑定传入；表名、列名、排序方向等占位符覆盖不到的位置，改用固定白名单映射。
      cwe: "CWE-89: SQL Injection"
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: request.args
          - pattern: request.form
          - pattern: request.values
          - pattern: request.json
          - pattern: request.data
          - pattern: request.get_json(...)
          - pattern: input(...)
          - pattern: sys.argv
          - pattern: os.environ
    pattern-sinks:
      # 只把**第一个实参**当作汇聚点：第二个实参是绑定参数，
      # 正是参数化查询的安全写法，把它算进来会把安全写法判成注入。
      - patterns:
          - pattern: $CUR.execute($SQL, ...)
          - focus-metavariable: $SQL
      - patterns:
          - pattern: $CUR.executemany($SQL, ...)
          - focus-metavariable: $SQL

  - id: argus.semgrep.python-command
    languages: [python]
    severity: ERROR
    message: 疑似命令注入：外部输入经数据流到达 shell 执行
    metadata:
      argus-type: command_injection
      argus-title: 疑似命令注入（数据流已确认来源）
      argus-recommendation: 用参数列表调用子进程（不经过 shell），并对取值做白名单校验；确实需要拼接时先用 shlex.quote 转义。
      cwe: "CWE-78: OS Command Injection"
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: request.args
          - pattern: request.form
          - pattern: request.values
          - pattern: request.json
          - pattern: request.data
          - pattern: request.get_json(...)
          - pattern: input(...)
          - pattern: sys.argv
          - pattern: os.environ
    pattern-sinks:
      - pattern-either:
          - pattern: os.system(...)
          - pattern: os.popen(...)
          - pattern: subprocess.$FN(..., shell=True, ...)

  - id: argus.semgrep.python-dynamic-exec
    languages: [python]
    severity: ERROR
    message: 疑似不安全动态执行：外部输入被当作代码执行
    metadata:
      argus-type: unsafe_dynamic_execution
      argus-title: 疑似不安全动态执行（数据流已确认来源）
      argus-recommendation: 不要用 eval/exec 执行外部输入。需要动态行为时改为显式的映射表或受限的解释器接口。
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: request.args
          - pattern: request.form
          - pattern: request.values
          - pattern: request.json
          - pattern: request.data
          - pattern: request.get_json(...)
          - pattern: input(...)
          - pattern: sys.argv
          - pattern: os.environ
    pattern-sinks:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)
          - pattern: compile(...)

  - id: argus.semgrep.python-deserialization
    languages: [python]
    severity: ERROR
    message: 疑似不安全反序列化：外部输入被交给 pickle 解析
    metadata:
      argus-type: unsafe_deserialization
      argus-title: 疑似不安全反序列化（数据流已确认来源）
      argus-recommendation: 不要反序列化不可信数据。改用 JSON 等纯数据格式；确实需要结构化对象时，用显式字段校验后的构造过程代替 pickle。
      cwe: "CWE-502: Deserialization of Untrusted Data"
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: request.args
          - pattern: request.form
          - pattern: request.values
          - pattern: request.json
          - pattern: request.data
          - pattern: request.get_json(...)
          - pattern: input(...)
          - pattern: sys.argv
          - pattern: os.environ
    pattern-sinks:
      - pattern-either:
          - pattern: pickle.loads(...)
          - pattern: pickle.load(...)

  # ------------------------------------------------------------------
  # JavaScript / TypeScript
  # ------------------------------------------------------------------

  - id: argus.semgrep.js-xss
    languages: [javascript, typescript]
    severity: ERROR
    message: 疑似跨站脚本：外部输入经数据流写入 DOM
    metadata:
      argus-type: xss
      argus-title: 疑似跨站脚本（数据流已确认来源）
      argus-recommendation: 用 textContent 代替 innerHTML；必须输出 HTML 时先用 DOMPurify 等可信的净化库处理，并确认净化针对的是 HTML 语境。
      cwe: "CWE-79: Cross-site Scripting"
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: req.query
          - pattern: req.body
          - pattern: req.params
          - pattern: req.cookies
          - pattern: req.headers
          - pattern: request.query
          - pattern: request.body
          - pattern: location.hash
          - pattern: location.search
          - pattern: document.URL
          - pattern: window.name
    pattern-sinks:
      - patterns:
          - pattern: $EL.innerHTML = $X
          - focus-metavariable: $X
      - patterns:
          - pattern: $EL.outerHTML = $X
          - focus-metavariable: $X
      - pattern: document.write(...)
      - patterns:
          - pattern: $EL.insertAdjacentHTML(..., $X, ...)
          - focus-metavariable: $X

  - id: argus.semgrep.js-dynamic-exec
    languages: [javascript, typescript]
    severity: ERROR
    message: 疑似不安全动态执行：外部输入被当作代码执行
    metadata:
      argus-type: unsafe_dynamic_execution
      argus-title: 疑似不安全动态执行（数据流已确认来源）
      argus-recommendation: 不要用 eval/new Function 执行外部输入；定时器请传函数而不是字符串。
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: req.query
          - pattern: req.body
          - pattern: req.params
          - pattern: req.cookies
          - pattern: req.headers
          - pattern: location.hash
          - pattern: location.search
          - pattern: document.URL
          - pattern: window.name
    pattern-sinks:
      - pattern-either:
          - pattern: eval(...)
          - pattern: new Function(...)
      - patterns:
          - pattern: setTimeout($CODE, ...)
          - focus-metavariable: $CODE
      - patterns:
          - pattern: setInterval($CODE, ...)
          - focus-metavariable: $CODE

  # ------------------------------------------------------------------
  # PHP
  # ------------------------------------------------------------------

  - id: argus.semgrep.php-command
    languages: [php]
    severity: ERROR
    message: 疑似命令注入：外部输入经数据流到达 shell 执行
    metadata:
      argus-type: command_injection
      argus-title: 疑似命令注入（数据流已确认来源）
      argus-recommendation: 用 escapeshellarg 转义每个参数，并优先改用不经过 shell 的调用方式；能固定下来的命令参数不要拼接。
      cwe: "CWE-78: OS Command Injection"
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - pattern: $_SERVER
          - pattern: file_get_contents("php://input")
    pattern-sinks:
      - pattern-either:
          - pattern: system(...)
          - pattern: exec(...)
          - pattern: shell_exec(...)
          - pattern: passthru(...)
          - pattern: popen(...)
          - pattern: proc_open(...)

  - id: argus.semgrep.php-sqli
    languages: [php]
    severity: ERROR
    message: 疑似 SQL 注入：外部输入经数据流到达数据库执行
    metadata:
      argus-type: sql_injection
      argus-title: 疑似 SQL 注入（数据流已确认来源）
      argus-recommendation: 改用 PDO 或 mysqli 的预处理语句与参数绑定；表名、列名等位置改用固定白名单映射。
      cwe: "CWE-89: SQL Injection"
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - pattern: $_SERVER
    pattern-sinks:
      - pattern-either:
          - pattern: mysql_query(...)
          - pattern: pg_query(...)
          - pattern: mysqli_query(...)
          - pattern: $CONN->query(...)
          - pattern: $CONN->exec(...)

  # ------------------------------------------------------------------
  # Java
  # ------------------------------------------------------------------

  - id: argus.semgrep.java-command
    languages: [java]
    severity: ERROR
    message: 疑似命令注入：请求参数经数据流到达进程调用
    metadata:
      argus-type: command_injection
      argus-title: 疑似命令注入（数据流已确认来源）
      argus-recommendation: 用 ProcessBuilder 的命令列表形式，并对每个参数做白名单校验；不要把请求参数拼进一整条命令字符串。
      cwe: "CWE-78: OS Command Injection"
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.getParameter(...)
          - pattern: $REQ.getParameterValues(...)
          - pattern: $REQ.getHeader(...)
          - pattern: $REQ.getQueryString()
    pattern-sinks:
      - pattern-either:
          - pattern: Runtime.getRuntime().exec(...)
          - pattern: new ProcessBuilder(...)

  - id: argus.semgrep.java-sqli
    languages: [java]
    severity: ERROR
    message: 疑似 SQL 注入：请求参数经数据流到达 SQL 执行
    metadata:
      argus-type: sql_injection
      argus-title: 疑似 SQL 注入（数据流已确认来源）
      argus-recommendation: 使用 PreparedStatement 与参数绑定；表名、列名等位置改用固定白名单映射。
      cwe: "CWE-89: SQL Injection"
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.getParameter(...)
          - pattern: $REQ.getParameterValues(...)
          - pattern: $REQ.getHeader(...)
    pattern-sinks:
      - pattern-either:
          - pattern: $STMT.executeQuery(...)
          - pattern: $STMT.execute(...)
          - pattern: $STMT.executeUpdate(...)
          - pattern: $CONN.prepareStatement(...)

  # ------------------------------------------------------------------
  # Go
  # ------------------------------------------------------------------

  - id: argus.semgrep.go-command
    languages: [go]
    severity: ERROR
    message: 疑似命令注入：请求参数经数据流到达进程调用
    metadata:
      argus-type: command_injection
      argus-title: 疑似命令注入（数据流已确认来源）
      argus-recommendation: 用 exec.Command 的参数列表形式，并校验每个参数；不要把请求内容拼进命令名或整条命令。
      cwe: "CWE-78: OS Command Injection"
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $R.URL.Query()
          - pattern: $R.FormValue(...)
          - pattern: $R.PostFormValue(...)
          - pattern: $C.Query(...)
    pattern-sinks:
      - pattern-either:
          - pattern: exec.Command(...)
          - pattern: exec.CommandContext(...)

  # ------------------------------------------------------------------
  # Ruby
  # ------------------------------------------------------------------

  - id: argus.semgrep.ruby-command
    languages: [ruby]
    severity: ERROR
    message: 疑似命令注入：请求参数经数据流到达 shell 执行
    metadata:
      argus-type: command_injection
      argus-title: 疑似命令注入（数据流已确认来源）
      argus-recommendation: 用 Shellwords.escape 转义参数，或改用不经过 shell 的调用方式；不要把请求参数拼进命令字符串。
      cwe: "CWE-78: OS Command Injection"
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: params[...]
          - pattern: cookies[...]
          - pattern: request.params
          - pattern: request.query_string
    pattern-sinks:
      - pattern-either:
          - pattern: system(...)
          - pattern: exec(...)
          - pattern: IO.popen(...)
          # 反引号执行（`cmd`）刻意没有登记：Semgrep 对它的模式写法与
          # 普通调用不同，写错会静默不匹配。宁可漏报这一种，也不留一条
          # "看起来覆盖了、实际从没命中过"的规则——那比没有更误导。
